<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Моя напоминалка</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            border: 1px solid #ccc;
        }

        .add-button {
            border: none;
            background: #4f7cff;
            color: white;
            cursor: pointer;
        }

        .medicine {
            background: #f0f3ff;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
        }

        .delete-button {
            background: #ff5c5c;
            color: white;
            border: none;
            width: auto;
            padding: 8px 12px;
            cursor: pointer;
        }

        .notification-button {
            background: #45a049;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💊 Моя напоминалка</h1>

    <p>Добавь лекарство и время</p>

    <input
        id="medicineName"
        type="text"
        placeholder="Название лекарства"
    >

    <input
        id="medicineTime"
        type="time"
    >

    <button class="add-button" onclick="addMedicine()">
        Добавить напоминание
    </button>

    <button class="notification-button" onclick="enableNotifications()">
        🔔 Разрешить уведомления
    </button>

    <div id="medicineList"></div>

</div>

<script>

let medicines =
    JSON.parse(localStorage.getItem("medicines")) || [];

const WORKER_URL =
    "napominalka.kardinaltoo9.workers.dev";


function showMedicines() {

    let list =
        document.getElementById("medicineList");

    list.innerHTML = "";

    medicines.forEach(function(medicine, index) {

        let item =
            document.createElement("div");

        item.className = "medicine";

        item.innerHTML =
            "💊 " + medicine.name +
            " — ⏰ " + medicine.time +
            "<br>" +
            "<button class='delete-button' onclick='deleteMedicine(" +
            index +
            ")'>🗑️ Удалить</button>";

        list.appendChild(item);
    });
}


function addMedicine() {

    let name =
        document.getElementById("medicineName").value;

    let time =
        document.getElementById("medicineTime").value;

    if (name === "" || time === "") {

        alert("Заполни название и время");

        return;
    }

    medicines.push({
        name: name,
        time: time
    });

    localStorage.setItem(
        "medicines",
        JSON.stringify(medicines)
    );

    document.getElementById("medicineName").value = "";

    document.getElementById("medicineTime").value = "";

    showMedicines();
}


function deleteMedicine(index) {

    medicines.splice(index, 1);

    localStorage.setItem(
        "medicines",
        JSON.stringify(medicines)
    );

    showMedicines();
}


async function enableNotifications() {

    if (!("Notification" in window)) {

        alert("Этот браузер не поддерживает уведомления.");

        return;
    }


    if (!("serviceWorker" in navigator)) {

        alert("Service Worker не поддерживается.");

        return;
    }


    if (!("PushManager" in window)) {

        alert("Push-уведомления не поддерживаются.");

        return;
    }


    const permission =
        await Notification.requestPermission();


    if (permission !== "granted") {

        alert("Разрешение на уведомления не получено.");

        return;
    }


    try {

        const registration =
            await navigator.serviceWorker.register("sw.js");


        const response =
            await fetch(
                WORKER_URL + "/vapid-public-key"
            );


        if (!response.ok) {

            throw new Error(
                "Не удалось получить Public Key"
            );
        }


        const publicKey =
            await response.text();


        const subscription =
            await registration.pushManager.subscribe({

                userVisibleOnly: true,

                applicationServerKey:
                    urlBase64ToUint8Array(publicKey)

            });


        console.log(
            "Push-подписка создана:",
            subscription
        );


        const saveResponse =
            await fetch(
                WORKER_URL + "/subscribe",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body:
                        JSON.stringify(subscription)
                }
            );


        if (!saveResponse.ok) {

            throw new Error(
                "Не удалось сохранить подписку"
            );
        }


        alert(
            "Уведомления подключены! 🔔"
        );


    } catch (error) {

        console.error(error);

        alert(
            "Не получилось подключить уведомления."
        );
    }
}


function urlBase64ToUint8Array(base64String) {

    const padding =
        "=".repeat(
            (4 - base64String.length % 4) % 4
        );

    const base64 =
        (
            base64String +
            padding
        )
        .replace(/-/g, "+")
        .replace(/_/g, "/");


    const rawData =
        window.atob(base64);


    const outputArray =
        new Uint8Array(rawData.length);


    for (
        let i = 0;
        i < rawData.length;
        ++i
    ) {

        outputArray[i] =
            rawData.charCodeAt(i);
    }


    return outputArray;
}


function checkMedicines() {

    let now =
        new Date();

    let currentTime =
        String(now.getHours()).padStart(2, "0") +
        ":" +
        String(now.getMinutes()).padStart(2, "0");


    medicines.forEach(function(medicine) {

        if (medicine.time === currentTime) {

            if (
                "Notification" in window &&
                Notification.permission === "granted"
            ) {

                new Notification(
                    "💊 Напоминание",
                    {
                        body:
                            "Пора принять: " +
                            medicine.name
                    }
                );
            }
        }
    });
}


showMedicines();


setInterval(
    checkMedicines,
    30000
);

</script>

</body>
</html>
