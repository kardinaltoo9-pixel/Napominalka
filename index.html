<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Моя напоминалка</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            border: 1px solid #ccc;
        }

        .add-button {
            border: none;
            background: #4f7cff;
            color: white;
            cursor: pointer;
        }

        .medicine {
            background: #f0f3ff;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
        }

        .delete-button {
            background: #ff5c5c;
            color: white;
            border: none;
            width: auto;
            padding: 8px 12px;
            cursor: pointer;
        }

        .notification-button {
            background: #45a049;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💊 Моя напоминалка</h1>

    <p>Добавь лекарство и время</p>

    <input id="medicineName" type="text" placeholder="Название лекарства">

    <input id="medicineTime" type="time">

    <button class="add-button" onclick="addMedicine()">
        Добавить напоминание
    </button>

    <button class="notification-button" onclick="enableNotifications()">
        🔔 Разрешить уведомления
    </button>

    <div id="medicineList"></div>

</div>

<script>

let medicines = JSON.parse(localStorage.getItem("medicines")) || [];

function showMedicines() {

    let list = document.getElementById("medicineList");

    list.innerHTML = "";

    medicines.forEach(function(medicine, index) {

        let item = document.createElement("div");

        item.className = "medicine";

        item.innerHTML =
            "💊 " + medicine.name +
            " — ⏰ " + medicine.time +
            "<br><button class='delete-button' onclick='deleteMedicine(" +
            index + ")'>🗑️ Удалить</button>";

        list.appendChild(item);
    });
}

function addMedicine() {

    let name = document.getElementById("medicineName").value;
    let time = document.getElementById("medicineTime").value;

    if (name === "" || time === "") {
        alert("Заполни название и время");
        return;
    }

    medicines.push({
        name: name,
        time: time
    });

    localStorage.setItem("medicines", JSON.stringify(medicines));

    document.getElementById("medicineName").value = "";
    document.getElementById("medicineTime").value = "";

    showMedicines();
}

function deleteMedicine(index) {

    medicines.splice(index, 1);

    localStorage.setItem("medicines", JSON.stringify(medicines));

    showMedicines();
}

function enableNotifications() {

    if ("Notification" in window) {

        Notification.requestPermission().then(function(permission) {

            if (permission === "granted") {
                alert("Уведомления разрешены! 🔔");
            } else {
                alert("Уведомления запрещены.");
            }

        });

    } else {
        alert("Этот браузер не поддерживает уведомления.");
    }
}

function checkMedicines() {

    let now = new Date();

    let currentTime =
        String(now.getHours()).padStart(2, "0") +
        ":" +
        String(now.getMinutes()).padStart(2, "0");

    medicines.forEach(function(medicine) {

        if (medicine.time === currentTime) {

            if (Notification.permission === "granted") {

                new Notification("💊 Напоминание", {
                    body: "Пора принять: " + medicine.name
                });

            }

        }

    });

}

showMedicines();

setInterval(checkMedicines, 30000);

</script>

</body>
</html>
